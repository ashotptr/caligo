map $http_user_agent $link_preview_agent {
    default 0;
    "~*(facebookexternalhit|facebot|twitterbot|telegrambot|whatsapp|slackbot|discordbot|linkedinbot|pinterestbot|redditbot|skypeuripreview|vkshare|viber|mastodon|bluesky|embedly|iframely)" 1;
}

map $uri $link_preview_page {
    default 1;
    "~\.[A-Za-z0-9]+$" 0;
}

map "$link_preview_agent$link_preview_page" $link_preview {
    default 0;
    "11" 1;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location /api/subscriptions/ {
        resolver 127.0.0.11 valid=10s;
        set $notifications http://caligo-notifications:8080;
        proxy_pass $notifications;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /api/subscriptions {
        resolver 127.0.0.11 valid=10s;
        set $subscribe http://caligo-notifications:8080;
        proxy_pass $subscribe;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /api/ml/songs {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s;
        set $ml http://caligo-ml:8080;
        rewrite ^ /songs break;
        proxy_pass $ml;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /api/ml/albums {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s;
        set $ml_albums http://caligo-ml:8080;
        rewrite ^ /albums break;
        proxy_pass $ml_albums;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /api/ml/ {
        return 404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://caligo-api:8080;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /live/moq {
        limit_except GET {
            deny all;
        }

        resolver 127.0.0.11 valid=10s;
        set $relay http://relay:8000;
        proxy_pass $relay;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host                   $host;
        proxy_set_header Upgrade                $http_upgrade;
        proxy_set_header Connection             "upgrade";
        proxy_set_header Sec-WebSocket-Key      $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version  $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /live/ {
        limit_except GET HEAD {
            deny all;
        }

        resolver 127.0.0.11 valid=10s;
        set $relay http://relay:8000;
        proxy_pass $relay;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host         $host;
        proxy_set_header Range        $http_range;
        proxy_set_header Accept       $http_accept;
        proxy_set_header Icy-MetaData $http_icy_metadata;
        proxy_set_header Connection   "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        add_header X-Content-Type-Options nosniff always;
    }

    location /radio/ {
        resolver 127.0.0.11 valid=10s;
        set $radio http://caligo:9001;
        proxy_pass $radio;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host       $host;
        proxy_set_header Accept     $http_accept;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(music|mixtape)/ {
        limit_except GET HEAD {
            deny all;
        }

        resolver 127.0.0.11 valid=10s;
        set $caligo http://caligo:8080;
        proxy_pass $caligo;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host       $host;
        proxy_set_header Range      $http_range;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;

        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /vod/ {
        limit_except GET HEAD {
            deny all;
        }

        resolver 127.0.0.11 valid=10s;
        set $vod http://vod:8010;
        proxy_pass $vod;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host       $host;
        proxy_set_header Range      $http_range;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /caligo {
        return 301 /caligo/;
    }

    location /caligo/ {
        resolver 127.0.0.11 valid=10s;
        set $caligo http://caligo:8080;
        rewrite ^/caligo/(.*)$ /$1 break;
        proxy_pass $caligo;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host       $host;
        proxy_set_header Range      $http_range;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location /client_refactor/ {
        limit_except GET HEAD {
            deny all;
        }

        resolver 127.0.0.11 valid=10s;
        set $caligo http://caligo:8080;
        proxy_pass $caligo;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location /chat/ {
        resolver 127.0.0.11 valid=10s;
        set $caligo http://caligo:8080;
        proxy_pass $caligo;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host                   $host;
        proxy_set_header Upgrade                $http_upgrade;
        proxy_set_header Connection             "upgrade";
        proxy_set_header Sec-WebSocket-Key      $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version  $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /cgi_bin/radio_rotation {
        return 404;
    }

    location /cgi_bin/ {
        resolver 127.0.0.11 valid=10s;
        set $caligo http://caligo:8080;
        proxy_pass $caligo;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host           $host;
        proxy_set_header Content-Type   $http_content_type;
        proxy_set_header Authorization  $http_authorization;
        proxy_set_header Connection     "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;

        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /share/ {
        limit_except GET HEAD {
            deny all;
        }

        resolver 127.0.0.11 valid=10s;
        set $share http://caligo-share:8080;
        proxy_pass $share;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        error_page 418 = @link_preview;

        if ($link_preview) {
            return 418;
        }

        try_files $uri $uri/ /index.html;
    }

    location @link_preview {
        resolver 127.0.0.11 valid=10s;
        set $share http://caligo-share:8080;
        proxy_pass $share;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
