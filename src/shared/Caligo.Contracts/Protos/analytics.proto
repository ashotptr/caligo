syntax = "proto3";

package caligo.analytics.v1;

option csharp_namespace = "Caligo.Contracts.Analytics";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

service AnalyticsReader {
  rpc GetPostStats (GetPostStatsRequest) returns (PostStats);

  rpc GetPostStatsBatch (GetPostStatsBatchRequest) returns (PostStatsBatch);

  rpc GetTopPosts (GetTopPostsRequest) returns (TopPosts);

  rpc StreamTrending (StreamTrendingRequest) returns (stream TrendingSnapshot);

  rpc GetViewSeries (GetViewSeriesRequest) returns (ViewSeries);

  rpc GetTopInWindow (GetTopInWindowRequest) returns (TopInWindow);

  rpc GetEngagementFunnel (GetEngagementFunnelRequest) returns (EngagementFunnel);

  rpc GetRadioPlays (GetRadioPlaysRequest) returns (RadioPlays);

  rpc GetPlaybackSummary (GetPlaybackSummaryRequest) returns (PlaybackSummary);

  rpc GetLabRuns (GetLabRunsRequest) returns (LabRuns);

  rpc GetLabRun (GetLabRunRequest) returns (LabRunDetail);
}

message GetPostStatsRequest {
  int32 post_id = 1;
}

message GetPostStatsBatchRequest {
  repeated int32 post_ids = 1;
}

message PostStats {
  int32 post_id = 1;
  int64 views = 2;
  int64 unique_visitors = 3;
}

message PostStatsBatch {
  repeated PostStats stats = 1;
}

message GetTopPostsRequest {
  int32 days = 1;
  int32 limit = 2;
}

message TopPosts {
  repeated PostStats posts = 1;
}

message StreamTrendingRequest {
  int32 limit = 1;
  int32 window_hours = 2;
}

message TrendingEntry {
  int32 post_id = 1;
  int64 score = 2;
}

message TrendingSnapshot {
  repeated TrendingEntry entries = 1;
  google.protobuf.Timestamp generated_at = 2;
  int32 window_hours = 3;
}

enum SeriesBucket {
  SERIES_BUCKET_UNSPECIFIED = 0;
  SERIES_BUCKET_MINUTE = 1;
  SERIES_BUCKET_HOUR = 2;
  SERIES_BUCKET_DAY = 3;
}

message GetViewSeriesRequest {
  int32 post_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  SeriesBucket bucket = 4;
}

message SeriesPoint {
  google.protobuf.Timestamp bucket_start = 1;
  int64 views = 2;
  int64 unique_visitors = 3;
  int64 claps = 4;
}

message ViewSeries {
  repeated SeriesPoint points = 1;
}

enum WindowOrder {
  WINDOW_ORDER_UNSPECIFIED = 0;
  WINDOW_ORDER_VIEWS = 1;
  WINDOW_ORDER_CLAPS = 2;
}

message GetTopInWindowRequest {
  int32 minutes = 1;
  WindowOrder order = 2;
  int32 limit = 3;
}

message WindowEntry {
  int32 post_id = 1;
  int64 views = 2;
  int64 unique_visitors = 3;
  int64 claps = 4;
}

message TopInWindow {
  repeated WindowEntry entries = 1;
  int32 minutes = 2;
}

message GetEngagementFunnelRequest {
  int32 post_id = 1;
  int32 days = 2;
}

message EngagementFunnel {
  int32 post_id = 1;
  int64 views = 2;
  int64 unique_visitors = 3;
  int64 clappers = 4;
  int64 claps = 5;
  int32 days = 6;
}

message GetRadioPlaysRequest {
  int32 limit = 1;
}

message RadioPlay {
  google.protobuf.Timestamp started_at = 1;
  string artist = 2;
  string album = 3;
  string title = 4;
  bool is_request = 5;
}

message RadioPlays {
  repeated RadioPlay plays = 1;
  bool enabled = 2;
}

message GetPlaybackSummaryRequest {
  int32 days = 1;
  int32 limit = 2;
}

message PlaybackTitle {
  int32 content_id = 1;
  int64 sessions = 2;
  int64 startups = 3;
  double median_startup_ms = 4;
  double p95_startup_ms = 5;
  int64 stalls = 6;
  int64 stall_ms = 7;
  int64 quality_switches = 8;
  int64 errors = 9;
  int64 hls_startups = 10;
  int64 native_hls_startups = 11;
  int64 dash_startups = 12;
  int64 progressive_startups = 13;
}

message PlaybackSummary {
  repeated PlaybackTitle titles = 1;
  bool enabled = 2;
  int32 days = 3;
}

message GetLabRunsRequest {
  int32 limit = 1;
}

message LabRun {
  string run_id = 1;
  string scenario = 2;
  string profile = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  int32 listeners = 6;
  int32 seconds = 7;
  int32 repetitions = 8;
  int32 contestants = 9;
  google.protobuf.DoubleValue source_bias_ms = 10;
  string notes = 11;
}

message LabRuns {
  repeated LabRun runs = 1;
  bool enabled = 2;
}

message GetLabRunRequest {
  string run_id = 1;
}

message LabContestant {
  string contestant = 1;
  string server = 2;
  string protocol = 3;
  string container = 4;
  int32 repetitions = 5;
  int64 listeners = 6;
  int64 connected = 7;
  google.protobuf.DoubleValue ttfb_p50_ms = 8;
  google.protobuf.DoubleValue startup_p50_ms = 9;
  google.protobuf.DoubleValue startup_p95_ms = 10;
  google.protobuf.DoubleValue startup_spread_ms = 11;
  int64 stalls = 12;
  double stall_ms = 13;
  double media_ms = 14;
  google.protobuf.DoubleValue latency_p50_ms = 15;
  google.protobuf.DoubleValue latency_spread_ms = 16;
  google.protobuf.DoubleValue data_latency_p50_ms = 17;
  google.protobuf.DoubleValue cpu_mean_percent = 18;
  google.protobuf.DoubleValue cpu_peak_percent = 19;
  google.protobuf.DoubleValue memory_peak_bytes = 20;
  int64 impaired_packets = 21;
  int64 impaired_lost = 22;
  int64 impaired_overflowed = 23;
  string errors = 24;
}

message LabLatencyPoint {
  string contestant = 1;
  int32 repetition = 2;
  google.protobuf.Timestamp measured_at = 3;
  double latency_ms = 4;
}

message LabRunDetail {
  bool enabled = 1;
  bool found = 2;
  LabRun run = 3;
  repeated LabContestant contestants = 4;
  repeated LabLatencyPoint latency = 5;
}
