name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      analytics: ${{ steps.filter.outputs.analytics }}
      notifications: ${{ steps.filter.outputs.notifications }}
      client: ${{ steps.filter.outputs.client }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'Directory.Packages.props'
              - 'src/shared/**'
              - '.github/workflows/ci.yml'
            api:
              - *shared
              - 'src/posts/**'
            analytics:
              - *shared
              - 'src/analytics/**'
            notifications:
              - *shared
              - 'src/notifications/**'
            client:
              - 'src/blog-client/**'
            k8s:
              - 'deploy/k8s/**'

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: |
          set -e
          for project in             tests/Blog.Posts.UnitTests             tests/Blog.Notifications.UnitTests             tests/Blog.Api.Tests
          do
            echo "::group::$project"
            dotnet test --no-build -c Release "$project"               --logger "trx;LogFileName=$(basename "$project").trx"               --collect:"XPlat Code Coverage"               --results-directory ./TestResults
            echo "::endgroup::"
          done

      - name: Integration tests
        run: >
          dotnet test --no-build -c Release
          tests/Blog.IntegrationTests/Blog.IntegrationTests.csproj
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ./TestResults

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

  client:
    name: Client - lint and build
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/blog-client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/blog-client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  manifests:
    name: Kubernetes manifests
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build both overlays
        run: |
          for overlay in dev prod; do
            kubectl kustomize "deploy/k8s/overlays/$overlay" > /dev/null
          done

      - name: Cross-resource validation
        run: |
          pip install --quiet pyyaml
          python deploy/k8s/validate.py

  publish:
    name: Publish images
    needs: [changes, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: blog-api
            changed: api
            context: .
            dockerfile: src/posts/Blog.Api/Dockerfile
          - service: blog-analytics
            changed: analytics
            context: .
            dockerfile: src/analytics/Blog.Analytics.Host/Dockerfile
          - service: blog-notifications
            changed: notifications
            context: .
            dockerfile: src/notifications/Blog.Notifications.Host/Dockerfile
          - service: blog-client
            changed: client
            context: src/blog-client
            dockerfile: src/blog-client/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - name: Should this service be rebuilt?
        id: should
        run: echo "run=${{ needs.changes.outputs[matrix.changed] }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.should.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.should.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.should.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image
        if: steps.should.outputs.run == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload scan results
        if: steps.should.outputs.run == 'true' && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
