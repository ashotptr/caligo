name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      analytics: ${{ steps.filter.outputs.analytics }}
      notifications: ${{ steps.filter.outputs.notifications }}
      client: ${{ steps.filter.outputs.client }}
      caligo: ${{ steps.filter.outputs.caligo }}
      streaming: ${{ steps.filter.outputs.streaming }}
      liquidsoap: ${{ steps.filter.outputs.liquidsoap }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'Directory.Packages.props'
              - 'src/shared/**'
              - '.github/workflows/ci.yml'
            api:
              - *shared
              - 'src/posts/**'
              - 'src/catalog/**'
              - 'src/streamingservice/**'
            analytics:
              - *shared
              - 'src/analytics/**'
            notifications:
              - *shared
              - 'src/notifications/**'
            client:
              - 'src/caligo-client/**'
            caligo:
              - 'src/caligo/**'
              - 'deploy/caligo/**'
            streaming:
              - 'src/caligo-streaming/**'
            liquidsoap:
              - 'deploy/liquidsoap/**'
            k8s:
              - 'deploy/k8s/**'

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: |
          set -e
          for project in             tests/Caligo.Posts.UnitTests             tests/Caligo.Catalog.UnitTests             tests/Caligo.Notifications.UnitTests             tests/Caligo.StreamLab.Tests             tests/Caligo.Api.Tests
          do
            echo "::group::$project"
            dotnet test --no-build -c Release "$project"               --logger "trx;LogFileName=$(basename "$project").trx"               --collect:"XPlat Code Coverage"               --results-directory ./TestResults
            echo "::endgroup::"
          done

      - name: Integration tests
        run: >
          dotnet test --no-build -c Release
          tests/Caligo.IntegrationTests/Caligo.IntegrationTests.csproj
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ./TestResults

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

  client:
    name: Client - lint and build
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/caligo-client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/caligo-client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  caligo:
    name: Caligo - build
    needs: changes
    if: needs.changes.outputs.caligo == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libjansson-dev libssl-dev

      - name: Build with its own Makefile, outside the checkout
        run: |
          cp -r src/caligo "$RUNNER_TEMP/caligo"
          make -C "$RUNNER_TEMP/caligo" all

  streaming:
    name: Caligo streaming (C) - build and test
    needs: changes
    if: needs.changes.outputs.streaming == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/caligo-streaming
    steps:
      - uses: actions/checkout@v5

      - name: Install OpenSSL, jansson and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libssl-dev libjansson-dev ffmpeg

      - name: Build with warnings as errors
        run: make EXTRA=-Werror all

      - name: Unit and integration tests
        run: make EXTRA=-Werror test

      - name: The same tests under AddressSanitizer and UBSan
        run: make sanitize

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: moq-lite against moq-dev's own client
        run: |
          npm ci --prefix tests/interop --no-audit --no-fund
          make EXTRA=-Werror interop

      - name: The lab's network impairment in two network namespaces
        run: |
          make EXTRA=-Werror netem
          sudo env CI=true python3 tests/netem_integration.py build/caligo-netem

  streaming-quic:
    name: Caligo streaming (C) - QUIC and WebTransport
    needs: changes
    if: needs.changes.outputs.streaming == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/caligo-streaming
    env:
      PICOQUIC_COMMIT: cc11becf4e90667e8145b4c7dd73985b17c6ddf8
    steps:
      - uses: actions/checkout@v5

      - name: Install OpenSSL, jansson and the picoquic build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libssl-dev libjansson-dev cmake pkg-config

      - name: Cache picoquic
        id: picoquic
        uses: actions/cache@v4
        with:
          path: ~/picoquic
          key: picoquic-${{ runner.os }}-${{ env.PICOQUIC_COMMIT }}

      - name: Build picoquic at the pinned commit
        if: steps.picoquic.outputs.cache-hit != 'true'
        run: |
          git init --quiet ~/picoquic
          git -C ~/picoquic fetch --quiet --depth 1 https://github.com/private-octopus/picoquic.git "$PICOQUIC_COMMIT"
          git -C ~/picoquic checkout --quiet FETCH_HEAD
          cmake -S ~/picoquic -B ~/picoquic/build -DCMAKE_BUILD_TYPE=Release -DPICOQUIC_FETCH_PTLS=ON \
            -DBUILD_DEMO=OFF -DBUILD_PQBENCH=OFF -DBUILD_LOGLIB=OFF -DBUILD_LOGREADER=OFF -DBUILD_TESTING=OFF
          cmake --build ~/picoquic/build --parallel --target picoquic-core picohttp-core

      - name: Build the QUIC relay with warnings as errors
        run: make EXTRA=-Werror PICOQUIC=$HOME/picoquic relay-quic

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: WebTransport against aioquic
        run: |
          python -m pip install --quiet aioquic==1.2.0
          make EXTRA=-Werror PICOQUIC=$HOME/picoquic quic-test

      - name: The same under AddressSanitizer and UBSan
        run: >
          make EXTRA=-Werror PICOQUIC=$HOME/picoquic BUILD=build/sanitize
          OPTIMIZE="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" quic-test

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: moq-dev's client in headless Chrome over WebTransport
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm ci --prefix tests/interop --no-audit --no-fund
          npm run --prefix tests/interop bundle
          make EXTRA=-Werror PICOQUIC=$HOME/picoquic browser-interop

  liquidsoap:
    name: Liquidsoap - script check
    needs: changes
    if: needs.changes.outputs.liquidsoap == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the Opus source script with the image compose runs
        run: |
          image=$(grep -m1 -o 'savonet/liquidsoap:[^"[:space:]]*' deploy/compose/docker-compose.yml)
          docker run --rm -v "$PWD/deploy/liquidsoap:/etc/liquidsoap:ro" "$image" --check /etc/liquidsoap/opus.liq

  manifests:
    name: Kubernetes manifests
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build both overlays
        run: |
          for overlay in dev prod; do
            kubectl kustomize "deploy/k8s/overlays/$overlay" > /dev/null
          done

      - name: Cross-resource validation
        run: |
          pip install --quiet pyyaml
          python deploy/k8s/validate.py

  publish:
    name: Publish images
    needs: [changes, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: caligo-api
            changed: api
            context: .
            dockerfile: src/posts/Caligo.Api/Dockerfile
          - service: caligo-analytics
            changed: analytics
            context: .
            dockerfile: src/analytics/Caligo.Analytics.Host/Dockerfile
          - service: caligo-notifications
            changed: notifications
            context: .
            dockerfile: src/notifications/Caligo.Notifications.Host/Dockerfile
          - service: caligo-client
            changed: client
            context: src/caligo-client
            dockerfile: src/caligo-client/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - name: Should this service be rebuilt?
        id: should
        run: echo "run=${{ needs.changes.outputs[matrix.changed] }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.should.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.should.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.should.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image
        if: steps.should.outputs.run == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload scan results
        if: steps.should.outputs.run == 'true' && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
