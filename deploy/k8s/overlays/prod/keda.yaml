apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: blog-analytics-lag
spec:
  scaleTargetRef:
    name: blog-analytics

  minReplicaCount: 2

  maxReplicaCount: 6

  pollingInterval: 15
  cooldownPeriod: 300

  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: analytics-raw-writer
        topic: blog.post.viewed.v1
        lagThreshold: "1000"
        offsetResetPolicy: earliest
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: analytics-olap
        topic: blog.post.viewed.v1
        lagThreshold: "1000"
        offsetResetPolicy: earliest
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: blog-notifications-queue
spec:
  scaleTargetRef:
    name: blog-notifications

  minReplicaCount: 2
  maxReplicaCount: 10

  pollingInterval: 15
  cooldownPeriod: 300

  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: blog.notifications.email
        mode: QueueLength
        value: "50"
      authenticationRef:
        name: rabbitmq-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-auth
spec:
  secretTargetRef:
    - parameter: host
      name: blog-secrets
      key: Notifications__RabbitMq
