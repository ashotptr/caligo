apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: caligo

resources:
  - ../../base
  - keda.yaml

patches:
  - target:
      kind: Deployment
      name: caligo-analytics
    patch: |
      - op: remove
        path: /spec/replicas
  - target:
      kind: Deployment
      name: caligo-notifications
    patch: |
      - op: remove
        path: /spec/replicas

  - target:
      kind: Ingress
      name: caligo
    patch: |
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - caligo.example.com
            secretName: caligo-tls

images:
  - name: ghcr.io/ashotptr/caligo/caligo-api
    newTag: latest
  - name: ghcr.io/ashotptr/caligo/caligo-analytics
    newTag: latest
  - name: ghcr.io/ashotptr/caligo/caligo-notifications
    newTag: latest
  - name: ghcr.io/ashotptr/caligo/caligo-client
    newTag: latest
