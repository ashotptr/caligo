apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blog

resources:
  - ../../base
  - keda.yaml

patches:
  - target:
      kind: Deployment
      name: blog-analytics
    patch: |
      - op: remove
        path: /spec/replicas
  - target:
      kind: Deployment
      name: blog-notifications
    patch: |
      - op: remove
        path: /spec/replicas

  - target:
      kind: Ingress
      name: blog
    patch: |
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - blog.example.com
            secretName: blog-tls

images:
  - name: ghcr.io/ashotptr/blog/blog-api
    newTag: latest
  - name: ghcr.io/ashotptr/blog/blog-analytics
    newTag: latest
  - name: ghcr.io/ashotptr/blog/blog-notifications
    newTag: latest
  - name: ghcr.io/ashotptr/blog/blog-client
    newTag: latest
