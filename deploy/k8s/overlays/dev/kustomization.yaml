apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: caligo

resources:
  - ../../base
  - secrets.yaml
  - dependencies/stateful.yaml
  - dependencies/kafka.yaml
  - dependencies/clickhouse.yaml

patches:
  - target:
      kind: Deployment
      name: caligo-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: caligo-analytics
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: caligo-notifications
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: caligo-client
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: PodDisruptionBudget
      name: caligo-api
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: HorizontalPodAutoscaler
      name: caligo-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: Ingress
      name: caligo
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: caligo.localtest.me

images:
  - name: ghcr.io/ashotptr/caligo/caligo-api
    newName: caligo-dev-caligo-api
    newTag: latest
  - name: ghcr.io/ashotptr/caligo/caligo-analytics
    newName: caligo-dev-caligo-analytics
    newTag: latest
  - name: ghcr.io/ashotptr/caligo/caligo-notifications
    newName: caligo-dev-caligo-notifications
    newTag: latest
  - name: ghcr.io/ashotptr/caligo/caligo-client
    newName: caligo-dev-caligo-client
    newTag: latest
