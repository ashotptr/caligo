apiVersion: v1
kind: Secret
metadata:
  name: blog-secrets
type: Opaque
stringData:
  # Development values, committed on purpose so `kubectl apply -k overlays/dev` works on an
  # empty cluster with no setup. The prod overlay does NOT contain a Secret at all - see the
  # note in overlays/prod/kustomization.yaml.
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=blogdb;Username=postgres;Password=postgres"
  ConnectionStrings__Notifications: "Host=postgres;Port=5432;Database=blognotifications;Username=postgres;Password=postgres"
  ConnectionStrings__Redis: "redis:6379"
  ConnectionStrings__Mongo: "mongodb://blog:blogpass@mongo:27017/"
  Notifications__RabbitMq: "amqp://blog:blogpass@rabbitmq:5672/"
  Jwt__Key: "development-only-signing-key-at-least-32-bytes-long"
  AdminUser__Email: "admin@localhost.dev"
  AdminUser__Password: "AdminDev04!"
