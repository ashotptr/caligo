apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clickhouse }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clickhouse }
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.8
          env:
            - name: CLICKHOUSE_DB
              value: blog_analytics
            - name: CLICKHOUSE_USER
              value: blog
            - name: CLICKHOUSE_PASSWORD
              value: blogpass
          ports: [{ name: http, containerPort: 8123 }]
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector: { app.kubernetes.io/name: clickhouse }
  ports: [{ name: http, port: 8123, targetPort: http }]
