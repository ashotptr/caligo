apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caligo
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: caligo.example.com
      http:
        paths:
          - path: /api/subscriptions
            pathType: Prefix
            backend:
              service:
                name: caligo-notifications
                port:
                  name: http

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: caligo-api
                port:
                  name: http

          - path: /
            pathType: Prefix
            backend:
              service:
                name: caligo-client
                port:
                  name: http
