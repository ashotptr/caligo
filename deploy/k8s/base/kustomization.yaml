apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blog

resources:
  - namespace.yaml
  - config.yaml
  - blog-api.yaml
  - blog-analytics.yaml
  - blog-notifications.yaml
  - blog-client.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: blog
    includeSelectors: false
