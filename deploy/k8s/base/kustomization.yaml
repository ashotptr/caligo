apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: caligo

resources:
  - namespace.yaml
  - config.yaml
  - caligo-api.yaml
  - caligo-analytics.yaml
  - caligo-notifications.yaml
  - caligo-client.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: caligo
    includeSelectors: false
