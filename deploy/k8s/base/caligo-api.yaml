apiVersion: apps/v1
kind: Deployment
metadata:
  name: caligo-api
  labels:
    app.kubernetes.io/name: caligo-api
    app.kubernetes.io/part-of: caligo
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: caligo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caligo-api
        app.kubernetes.io/part-of: caligo
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: caligo-api

      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        fsGroup: 64198
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: caligo-api
          image: ghcr.io/ashotptr/caligo/caligo-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: caligo-config
            - secretRef:
                name: caligo-secrets

          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: caligo-api
  labels:
    app.kubernetes.io/name: caligo-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: caligo-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: caligo-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: caligo-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: caligo-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: caligo-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
