apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-notifications
  labels:
    app.kubernetes.io/name: blog-notifications
    app.kubernetes.io/part-of: blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blog-notifications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blog-notifications
        app.kubernetes.io/part-of: blog
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        fsGroup: 64198
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: blog-notifications
          image: ghcr.io/ashotptr/blog/blog-notifications:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"

          envFrom:
            - configMapRef:
                name: blog-config
            - secretRef:
                name: blog-secrets

          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 384Mi

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      terminationGracePeriodSeconds: 45

      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: blog-notifications
  labels:
    app.kubernetes.io/name: blog-notifications
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blog-notifications
  ports:
    - name: http
      port: 8080
      targetPort: http
