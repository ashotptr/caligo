apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-client
  labels:
    app.kubernetes.io/name: blog-client
    app.kubernetes.io/part-of: blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blog-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blog-client
        app.kubernetes.io/part-of: blog
    spec:
      containers:
        - name: blog-client
          image: ghcr.io/ashotptr/blog/blog-client:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: blog-client
  labels:
    app.kubernetes.io/name: blog-client
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blog-client
  ports:
    - name: http
      port: 80
      targetPort: http
