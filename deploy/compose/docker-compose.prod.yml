name: caligo-deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: caligodb
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_MULTIPLE_DATABASES: caligonotifications
    volumes:
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d caligodb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: caligo
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: caligo
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: caligo_analytics
      CLICKHOUSE_USER: caligo
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - clickhousedata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  caligo-api:
    build:
      context: ../..
      dockerfile: src/posts/Caligo.Api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Otlp__Endpoint: "http://aspire-dashboard:18889"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=caligodb;Username=bloguser;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
      Analytics__Address: "http://caligo-analytics:8080"
      Jwt__Key: ${JWT_KEY:?}
      Jwt__Issuer: caligo-api
      Jwt__Audience: caligo-client
      Cors__AllowedOrigins: "https://caligo.${DOMAIN:?}"
      AdminUser__Email: ${ADMIN_EMAIL:?}
      AdminUser__Password: ${ADMIN_PASSWORD:?}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
      Catalog__CaligoPublicRoot: "/caligo/public_html"
      Media__Enabled: ${MEDIA_ENABLED:-false}
      Media__SigningKey: ${MEDIA_SIGNING_KEY:-}
      Media__IncomingPath: "/media/incoming"
    volumes:
      - dpkeys:/home/app/.aspnet/DataProtection-Keys
      - ../../src/caligo/public_html:/caligo/public_html:ro
      - ../../media/incoming:/media/incoming:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      caligo-analytics:
        condition: service_healthy

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  caligo-analytics:
    build:
      context: ../..
      dockerfile: src/analytics/Caligo.Analytics.Host/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      Otlp__Endpoint: "http://aspire-dashboard:18889"
      ConnectionStrings__Mongo: "mongodb://caligo:${MONGO_PASSWORD:?}@mongo:27017/"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__ClickHouse: "Host=clickhouse;Port=8123;Username=caligo;Password=${CLICKHOUSE_PASSWORD:?};Database=caligo_analytics"
      Kafka__BootstrapServers: "kafka:29092"
      Radio__EventsUrl: "http://caligo-client/radio/events"
      Radio__StatsUrl: "http://caligo-client/live/stats"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  caligo-notifications:
    build:
      context: ../..
      dockerfile: src/notifications/Caligo.Notifications.Host/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      Otlp__Endpoint: "http://aspire-dashboard:18889"
      ConnectionStrings__Notifications: "Host=postgres;Port=5432;Database=caligonotifications;Username=bloguser;Password=${POSTGRES_PASSWORD:?}"
      Notifications__RabbitMq: "amqp://caligo:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/"
      Notifications__KafkaBootstrapServers: "kafka:29092"
      Notifications__SiteUrl: "https://caligo.${DOMAIN:?}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__UseStartTls: "${SMTP_STARTTLS:-true}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM:-caligo@localhost}"
      Smtp__FromName: "${SMTP_FROM_NAME:-Caligo}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      KAFKA_CLUSTERS_0_NAME: caligo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      kafka:
        condition: service_healthy

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.2
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"

  caligo-client:
    build:
      context: ../../src/caligo-client
      args:
        VITE_API_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default
      - caligo
    depends_on:
      - caligo-api

  caligo:
    build:
      context: ../..
      dockerfile: deploy/caligo/Dockerfile
      args:
        CALIGO_PYTHON: ${CALIGO_PYTHON:-lean}
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 2g
    cpus: 2
    volumes:
      - ../../src/caligo:/caligo-copy:ro
      - ../../src/caligo/public_html/music:/root/CaligoEngine/public_html/music
      - ../../src/caligo/public_html/mixtape:/root/CaligoEngine/public_html/mixtape
      - ../../src/caligo/data:/root/CaligoEngine/data
      - ../../src/caligo/user_memories:/root/CaligoEngine/user_memories
      - caligostate:/caligo-state
    networks:
      - caligo

  relay:
    build:
      context: ../../src/caligo-streaming
      target: relay
    restart: unless-stopped
    logging: *default-logging
    environment:
      RELAY_SOURCE_HOST: caligo
      RELAY_SOURCE_PORT: "9001"
      RELAY_SOURCE_PASSWORD: ${RELAY_SOURCE_PASSWORD:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    networks:
      - caligo
    depends_on:
      - caligo

  liquidsoap:
    profiles: ["liquidsoap"]
    image: savonet/liquidsoap:v2.4.6
    restart: unless-stopped
    logging: *default-logging
    command: ["/etc/liquidsoap/opus.liq"]
    environment:
      RELAY_SOURCE_PASSWORD: ${RELAY_SOURCE_PASSWORD:-}
    volumes:
      - ../liquidsoap:/etc/liquidsoap:ro
    tmpfs:
      - /var/cache/liquidsoap:uid=100,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1
    networks:
      - caligo
    depends_on:
      - relay
      - caligo

  vod:
    profiles: ["media"]
    build:
      context: ../../src/caligo-streaming
      target: vod
    restart: unless-stopped
    logging: *default-logging
    environment:
      API_HOST: caligo-api
      API_PORT: "8080"
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:-}
      VOD_LIBRARY: /media/library
    volumes:
      - medialibrary:/media/library:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    depends_on:
      - caligo-api

  packager:
    profiles: ["media"]
    build:
      context: ../../src/caligo-streaming
      target: packager
    restart: unless-stopped
    logging: *default-logging
    environment:
      API_HOST: caligo-api
      API_PORT: "8080"
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:-}
      PACKAGER_INCOMING: /media/incoming
      PACKAGER_LIBRARY: /media/library
    volumes:
      - ../../media/incoming:/media/incoming:ro
      - medialibrary:/media/library
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    depends_on:
      - caligo-api

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on:
      - caligo-client

networks:
  caligo:

volumes:
  pgdata:
  dpkeys:
  rabbitdata:
  mongodata:
  kafkadata:
  clickhousedata:
  caligostate:
  medialibrary:
