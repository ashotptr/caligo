name: caligo-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caligodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: caligonotifications
    volumes:
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - ../../data/dev/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caligodb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ../../data/dev/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: caligo
      RABBITMQ_DEFAULT_PASS: caligopass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../../data/dev/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - ../../data/dev/kafka/data:/var/lib/kafka/data
      - ../../data/dev/kafka/secrets:/etc/kafka/secrets
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: caligo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: caligo
      MONGO_INITDB_ROOT_PASSWORD: caligopass
    ports:
      - "27017:27017"
    volumes:
      - ../../data/dev/mongo/db:/data/db
      - ../../data/dev/mongo/configdb:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_DB: caligo_analytics
      CLICKHOUSE_USER: caligo
      CLICKHOUSE_PASSWORD: caligopass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    volumes:
      - ../../data/dev/clickhouse:/var/lib/clickhouse
      - ./clickhouse-logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  caligo-api:
    build:
      context: ../..
      dockerfile: src/posts/Caligo.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Otlp__Endpoint: "http://aspire-dashboard:18889"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=caligodb;Username=postgres;Password=postgres"
      Database__FallbackToSqlite: "false"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
      Analytics__Address: "http://caligo-analytics:8080"
      Jwt__Key: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      Jwt__Issuer: caligo-api
      Jwt__Audience: caligo-client
      Jwt__AccessTokenMinutes: "5"
      Cors__AllowedOrigins: "http://localhost:8080,http://localhost:5173"
      AdminUser__Email: "admin@localhost.dev"
      AdminUser__Password: "AdminDev04!"
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
      ForwardedHeaders__KnownNetworks__1: "192.168.0.0/16"
      ForwardedHeaders__KnownNetworks__2: "10.0.0.0/8"
      Catalog__CaligoPublicRoot: "/caligo/public_html"
      Catalog__CaligoEngineUrl: "http://caligo:8080"
      Catalog__CaligoDataRoot: "/caligo/data"
      Media__Enabled: "true"
      Media__SigningKey: ${MEDIA_SIGNING_KEY:-dev-media-signing-key-0123456789abcdef}
      Media__IncomingPath: "/media/incoming"
    volumes:
      - ../../src/caligo/public_html:/caligo/public_html:ro
      - ../../src/caligo/data:/caligo/data:ro
      - ../../media/incoming:/media/incoming:ro
    networks:
      - default
      - caligo
    ports:
      - "5028:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      caligo-analytics:
        condition: service_started

  caligo-analytics:
    build:
      context: ../..
      dockerfile: src/analytics/Caligo.Analytics.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Otlp__Endpoint: "http://aspire-dashboard:18889"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Mongo: "mongodb://caligo:caligopass@mongo:27017/"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__ClickHouse: "Host=clickhouse;Port=8123;Username=caligo;Password=caligopass;Database=caligo_analytics"
      Kafka__BootstrapServers: "kafka:29092"
      Radio__EventsUrl: "http://caligo-client/radio/events"
      Radio__StatsUrl: "http://caligo-client/live/stats"
    ports:
      - "5029:8081"
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.2
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  caligo-notifications:
    build:
      context: ../..
      dockerfile: src/notifications/Caligo.Notifications.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Otlp__Endpoint: "http://aspire-dashboard:18889"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Notifications: "Host=postgres;Port=5432;Database=caligonotifications;Username=postgres;Password=postgres"
      Notifications__RabbitMq: "amqp://caligo:caligopass@rabbitmq:5672/"
      Notifications__KafkaBootstrapServers: "kafka:29092"
      Notifications__SiteUrl: "http://localhost:8080"
      Smtp__Host: "mailhog"
      Smtp__Port: "1025"
    ports:
      - "5030:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  caligo-client:
    build:
      context: ../../src/caligo-client
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    networks:
      - default
      - caligo
    depends_on:
      - caligo-api

  caligo:
    build:
      context: ../..
      dockerfile: deploy/caligo/Dockerfile
      args:
        CALIGO_PYTHON: ${CALIGO_PYTHON:-lean}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 2g
    cpus: 2
    volumes:
      - ../../src/caligo:/caligo-copy:ro
      - ../../src/caligo/public_html/music:/root/CaligoEngine/public_html/music
      - ../../src/caligo/public_html/mixtape:/root/CaligoEngine/public_html/mixtape
      - ../../src/caligo/data:/root/CaligoEngine/data
      - ../../src/caligo/user_memories:/root/CaligoEngine/user_memories
      - ../../data/dev/caligo-home:/caligo-state/home
      - ../../src/caligo/chat_rooms.txt:/caligo-state/chat_rooms.txt
      - ../../src/caligo/cgi_debug.log:/caligo-state/cgi_debug.log
      - ../../src/caligo/agent_memory.json:/caligo-state/agent_memory.json
      - ../../src/caligo/cookies.txt:/caligo-state/cookies.txt
    networks:
      - caligo

  relay:
    build:
      context: ../../src/caligo-streaming
      target: relay-quic
    environment:
      RELAY_SOURCE_HOST: caligo
      RELAY_SOURCE_PORT: "9001"
      RELAY_SOURCE_PASSWORD: ${RELAY_SOURCE_PASSWORD:-dev-relay-source-password}
    ports:
      - "8443:8000"
      - "8443:8000/udp"
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    networks:
      - caligo
    depends_on:
      - caligo

  liquidsoap:
    profiles: ["liquidsoap"]
    image: savonet/liquidsoap:v2.4.6
    command: ["/etc/liquidsoap/opus.liq"]
    environment:
      RELAY_SOURCE_PASSWORD: ${RELAY_SOURCE_PASSWORD:-dev-relay-source-password}
    volumes:
      - ../liquidsoap:/etc/liquidsoap:ro
    tmpfs:
      - /var/cache/liquidsoap:uid=100,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    networks:
      - caligo
    depends_on:
      - relay
      - caligo

  vod:
    build:
      context: ../../src/caligo-streaming
      target: vod
    environment:
      API_HOST: caligo-api
      API_PORT: "8080"
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:-dev-media-signing-key-0123456789abcdef}
      VOD_LIBRARY: /media/library
    volumes:
      - ../../media/library:/media/library:ro
    ports:
      - "8010:8010"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    depends_on:
      - caligo-api

  packager:
    build:
      context: ../../src/caligo-streaming
      target: packager
    environment:
      API_HOST: caligo-api
      API_PORT: "8080"
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:-dev-media-signing-key-0123456789abcdef}
      PACKAGER_INCOMING: /media/incoming
      PACKAGER_LIBRARY: /media/library
    volumes:
      - ../../media/incoming:/media/incoming:ro
      - ../../media/library:/media/library
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    depends_on:
      - caligo-api

networks:
  caligo:
