services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=400

  caligo-api:
    ports: !reset []
    environment:
      RateLimiting__ReadsPermitLimit: "10000000"
      RateLimiting__AuthPermitLimit: "10000"
      Posts__MaxScheduledPerAuthor: "1000000"
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.05"

  caligo-analytics:
    environment:
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.05"

  caligo-notifications:
    environment:
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.05"

  load-tests:
    profiles: ["load-tests"]
    build:
      context: ../..
      dockerfile: tests/Caligo.LoadTests/Dockerfile
    environment:
      CALIGO_URL: http://caligo-client
      CALIGO_POSTS_DB: Host=postgres;Database=caligodb;Username=postgres;Password=postgres
      CALIGO_NOTIFICATIONS_DB: Host=postgres;Database=caligonotifications;Username=postgres;Password=postgres
      CALIGO_LAB_DB: Host=postgres;Database=caligolab;Username=postgres;Password=postgres;Maximum Pool Size=300
      CALIGO_CLICKHOUSE: Host=clickhouse;Port=8123;Username=caligo;Password=caligopass;Database=caligo_analytics
      CALIGO_KAFKA: kafka:29092
      CALIGO_REPORTS: /reports
    volumes:
      - ../../tests/Caligo.LoadTests/reports:/reports
