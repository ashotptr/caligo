listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=YES
local_enable=NO
write_enable=NO
anon_root=/lab-files
no_anon_password=YES
hide_ids=YES
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21199
max_clients=0
max_per_ip=0
seccomp_sandbox=NO
xferlog_enable=NO
dirmessage_enable=NO
secure_chroot_dir=/var/run/vsftpd/empty
